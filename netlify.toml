[build]
  command = "yarn check"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "development"
  YARN_VERSION = "1.22.22"
  YARN_FLAGS = "--production=false --non-interactive"

# SPA routing — كل المسارات ترجع لـ index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
