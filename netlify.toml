[build]
  command = "yarn run check"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "development"
  YARN_VERSION = "1.22.22"
  YARN_FLAGS = "--production=false --non-interactive"

# Preserve every path while consolidating the old .de domain onto .com.
[[redirects]]
  from = "https://tycoons-inv.de/*"
  to = "https://tycoons-inv.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/ar/"
  to = "/.netlify/functions/seo-page?lang=ar&type=home"
  status = 200

[[redirects]]
  from = "/en/"
  to = "/.netlify/functions/seo-page?lang=en&type=home"
  status = 200

[[redirects]]
  from = "/ar/projects/*"
  to = "/projects/:splat"
  status = 301
  force = true

# Retired/renamed project slugs found 404ing in GSC (Aug 2026): the developer or slug changed
# in the projects table but old inbound/crawled links still point at the old slug.
[[redirects]]
  from = "/en/projects/covaya--roya-developments"
  to = "/en/projects/covaya--pre-group"
  status = 301
  force = true

[[redirects]]
  from = "/en/projects/regents-square--al-dawlia-boutique-developments"
  to = "/en/projects/regent-s-square--al-dawlia-developments"
  status = 301
  force = true

[[redirects]]
  from = "/en/projects/*"
  to = "/.netlify/functions/seo-page?lang=en&type=project&slug=:splat"
  status = 200

# Retired area slugs (renamed to their current canonical slug) still surfacing in GSC.
[[redirects]]
  from = "/ar/areas/sodic-west-west-cairo"
  to = "/ar/areas/sheikh-zayed"
  status = 301
  force = true

[[redirects]]
  from = "/en/areas/sodic-west-west-cairo"
  to = "/en/areas/sheikh-zayed"
  status = 301
  force = true

[[redirects]]
  from = "/ar/areas/new-zayed"
  to = "/ar/areas/sheikh-zayed"
  status = 301
  force = true

[[redirects]]
  from = "/en/areas/new-zayed"
  to = "/en/areas/sheikh-zayed"
  status = 301
  force = true

[[redirects]]
  from = "/ar/areas/6th-of-october-city"
  to = "/ar/areas/october"
  status = 301
  force = true

[[redirects]]
  from = "/en/areas/6th-of-october-city"
  to = "/en/areas/october"
  status = 301
  force = true

[[redirects]]
  from = "/ar/areas/east-cairo"
  to = "/ar/areas/new-cairo"
  status = 301
  force = true

[[redirects]]
  from = "/en/areas/east-cairo"
  to = "/en/areas/new-cairo"
  status = 301
  force = true

[[redirects]]
  from = "/ar/areas/*"
  to = "/.netlify/functions/seo-page?lang=ar&type=area&slug=:splat"
  status = 200

[[redirects]]
  from = "/en/areas/*"
  to = "/.netlify/functions/seo-page?lang=en&type=area&slug=:splat"
  status = 200

[[redirects]]
  from = "/ar/developers/*"
  to = "/.netlify/functions/seo-page?lang=ar&type=developer&slug=:splat"
  status = 200

[[redirects]]
  from = "/en/developers/*"
  to = "/.netlify/functions/seo-page?lang=en&type=developer&slug=:splat"
  status = 200

# Retired guide slugs (renamed to their current canonical slug) still surfacing in GSC.
[[redirects]]
  from = "/guides/new-cairo-prices-2026/*"
  to = "/guides/new-cairo-property-prices/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/egypt-real-estate-investment-2026/*"
  to = "/guides/real-estate-investment-egypt/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/north-coast-buying-guide/*"
  to = "/guides/north-coast-chalet-guide/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/*"
  to = "/.netlify/functions/seo-page?lang=ar&type=guide&slug=:splat"
  status = 200

[[redirects]]
  from = "/methodology"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=methodology"
  status = 200

[[redirects]]
  from = "/corrections"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=corrections"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=contact"
  status = 200

[[redirects]]
  from = "/about"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=about"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=faq"
  status = 200

[[redirects]]
  from = "/search"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/search"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin.html"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=()"
    # WebMCP origin trial (first-party, subdomain matching). Sent on every path
    # so it covers all three render paths: the SPA shell, the build-time static
    # pages, and the Netlify function SSR pages.
    # EXPIRES 2026-11-17 — renew at https://developer.chrome.com/origintrials
    # The trial itself ends at Chrome 156; after that this header is dead weight
    # and the tools work (or don't) on the shipped API instead.
    Origin-Trial = "AmpXSEf7Y8P74TL7LNDacHR1HCFqxWD8b+1Xcpu6qGauLOjANuz1I4fpiDLBAJayEjVj5IcYSStodi0/o8xAFwwAAABieyJvcmlnaW4iOiJodHRwczovL3R5Y29vbnMtaW52LmNvbTo0NDMiLCJmZWF0dXJlIjoiV2ViTUNQIiwiZXhwaXJ5IjoxNzk0ODczNjAwLCJpc1N1YmRvbWFpbiI6dHJ1ZX0="

[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </llms.txt>; rel="service-doc"; type="text/plain", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </.well-known/mcp/server-card.json>; rel="service-desc"; type="application/json"'
    Vary = "Accept"

[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </llms.txt>; rel="service-doc"; type="text/plain", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </.well-known/mcp/server-card.json>; rel="service-desc"; type="application/json"'
    Vary = "Accept"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.well-known/agent-skills/search-properties/SKILL.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/docs/api.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

# Duplicate project URLs consolidated onto the canonical slugs.
[[redirects]]
  from = "/projects/mountain-view-grand-valleys--mountain-view"
  to = "/projects/grand-valleys--mountain-view"
  status = 301
  force = true

[[redirects]]
  from = "/projects/mindset--lmd"
  to = "/projects/mindset-residences--lmd"
  status = 301
  force = true

[[redirects]]
  from = "/projects/n-line-nest-residence--n-developments"
  to = "/projects/nest--n-developments"
  status = 301
  force = true

[[redirects]]
  from = "/projects/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/units/*"
  to = "/.netlify/functions/seo-page?lang=ar&type=unit&slug=:splat"
  status = 200

# Retired English guide URLs: send to the closest live guide.
[[redirects]]
  from = "/en/guides/egypt-real-estate-investment-2026/*"
  to = "/guides/real-estate-investment-egypt/"
  status = 301
  force = true

[[redirects]]
  from = "/en/guides/*"
  to = "/guides/:splat"
  status = 301
  force = true

# Retired region URLs with a direct canonical equivalent.
[[redirects]]
  from = "/regions/sahel"
  to = "/ar/areas/north-coast"
  status = 301
  force = true

[[redirects]]
  from = "/regions/capital"
  to = "/ar/areas/new-capital"
  status = 301
  force = true

[[redirects]]
  from = "/regions/new-cairo"
  to = "/ar/areas/new-cairo"
  status = 301
  force = true

[[redirects]]
  from = "/regions/mostakbal"
  to = "/ar/areas/mostakbal-city"
  status = 301
  force = true

[[redirects]]
  from = "/regions/north-coast"
  to = "/ar/areas/north-coast"
  status = 301
  force = true

[[redirects]]
  from = "/regions/sokhna"
  to = "/ar/areas/ain-sokhna"
  status = 301
  force = true

[[redirects]]
  from = "/regions/zayed"
  to = "/ar/areas/sheikh-zayed"
  status = 301
  force = true

[[redirects]]
  from = "/regions/new-capital"
  to = "/ar/areas/new-capital"
  status = 301
  force = true

# Any other retired region slug: try the same-named area page (returns 404 there if unknown).
[[redirects]]
  from = "/regions/*"
  to = "/ar/areas/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Unknown URLs must return a real 404 instead of a 200 homepage.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
