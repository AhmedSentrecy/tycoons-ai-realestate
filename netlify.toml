[build]
  command = "yarn run check"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "development"
  YARN_VERSION = "1.22.22"
  YARN_FLAGS = "--production=false --non-interactive"

# Preserve every path while consolidating the old .de domain onto .com.
[[redirects]]
  from = "https://tycoons-inv.de/*"
  to = "https://tycoons-inv.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/ar/"
  to = "/.netlify/functions/seo-page?lang=ar&type=home"
  status = 200

[[redirects]]
  from = "/en/"
  to = "/.netlify/functions/seo-page?lang=en&type=home"
  status = 200

[[redirects]]
  from = "/ar/projects/*"
  to = "/projects/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/projects/*"
  to = "/.netlify/functions/seo-page?lang=en&type=project&slug=:splat"
  status = 200

[[redirects]]
  from = "/ar/areas/*"
  to = "/.netlify/functions/seo-page?lang=ar&type=area&slug=:splat"
  status = 200

[[redirects]]
  from = "/en/areas/*"
  to = "/.netlify/functions/seo-page?lang=en&type=area&slug=:splat"
  status = 200

[[redirects]]
  from = "/ar/developers/*"
  to = "/.netlify/functions/seo-page?lang=ar&type=developer&slug=:splat"
  status = 200

[[redirects]]
  from = "/en/developers/*"
  to = "/.netlify/functions/seo-page?lang=en&type=developer&slug=:splat"
  status = 200

[[redirects]]
  from = "/guides/*"
  to = "/.netlify/functions/seo-page?lang=ar&type=guide&slug=:splat"
  status = 200

[[redirects]]
  from = "/methodology"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=methodology"
  status = 200

[[redirects]]
  from = "/corrections"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=corrections"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=contact"
  status = 200

[[redirects]]
  from = "/about"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=about"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/.netlify/functions/seo-page?lang=ar&type=static&slug=faq"
  status = 200

[[redirects]]
  from = "/search"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/search"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin.html"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=()"

[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </llms.txt>; rel="service-doc"; type="text/plain", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </.well-known/mcp/server-card.json>; rel="service-desc"; type="application/json"'
    Vary = "Accept"

[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </llms.txt>; rel="service-doc"; type="text/plain", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </.well-known/mcp/server-card.json>; rel="service-desc"; type="application/json"'
    Vary = "Accept"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.well-known/agent-skills/search-properties/SKILL.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/docs/api.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

# Duplicate project URLs consolidated onto the canonical slugs.
[[redirects]]
  from = "/projects/mountain-view-grand-valleys--mountain-view"
  to = "/projects/grand-valleys--mountain-view"
  status = 301
  force = true

[[redirects]]
  from = "/projects/mindset--lmd"
  to = "/projects/mindset-residences--lmd"
  status = 301
  force = true

[[redirects]]
  from = "/projects/n-line-nest-residence--n-developments"
  to = "/projects/nest--n-developments"
  status = 301
  force = true

[[redirects]]
  from = "/projects/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/units/*"
  to = "/404.html"
  status = 404

# Retired English guide URLs: send to the closest live guide.
[[redirects]]
  from = "/en/guides/egypt-real-estate-investment-2026/*"
  to = "/guides/real-estate-investment-egypt/"
  status = 301
  force = true

[[redirects]]
  from = "/en/guides/*"
  to = "/guides/:splat"
  status = 301
  force = true

# Retired region URLs with a direct canonical equivalent.
[[redirects]]
  from = "/regions/sahel"
  to = "/ar/areas/north-coast"
  status = 301
  force = true

[[redirects]]
  from = "/regions/capital"
  to = "/ar/areas/new-capital"
  status = 301
  force = true

[[redirects]]
  from = "/regions/new-cairo"
  to = "/ar/areas/new-cairo"
  status = 301
  force = true

[[redirects]]
  from = "/regions/mostakbal"
  to = "/ar/areas/mostakbal-city"
  status = 301
  force = true

[[redirects]]
  from = "/regions/north-coast"
  to = "/ar/areas/north-coast"
  status = 301
  force = true

[[redirects]]
  from = "/regions/sokhna"
  to = "/ar/areas/ain-sokhna"
  status = 301
  force = true

[[redirects]]
  from = "/regions/zayed"
  to = "/ar/areas/sheikh-zayed"
  status = 301
  force = true

[[redirects]]
  from = "/regions/new-capital"
  to = "/ar/areas/new-capital"
  status = 301
  force = true

# Any other retired region slug: try the same-named area page (returns 404 there if unknown).
[[redirects]]
  from = "/regions/*"
  to = "/ar/areas/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Unknown URLs must return a real 404 instead of a 200 homepage.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
