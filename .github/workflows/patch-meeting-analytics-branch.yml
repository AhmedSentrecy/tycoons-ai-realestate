name: Patch Meeting Analytics Branch

on:
  push:
    branches: [war-room-meeting-analytics]
    paths:
      - '.github/workflows/patch-meeting-analytics-branch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Patch control and agent dashboards
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(s,old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected one match, got {n}')
              return s.replace(old,new,1)

          p=Path('src/components/SalesWarRoomControlDashboard.tsx')
          s=p.read_text()
          s=replace_once(s,'import { salesWarRoomApi } from "../lib/salesWarRoomApi";','import { salesWarRoomApi } from "../lib/salesWarRoomApi";\nimport SalesWarRoomMeetingAnalytics from "./SalesWarRoomMeetingAnalytics";','control import')
          s=replace_once(s,'type Tab="overview"|"pipeline"|"agents";','type Tab="overview"|"analytics"|"pipeline"|"agents";','tab type')
          s=replace_once(s,'const tabs:Tab[]=manager?["overview","agents"]:["overview","pipeline","agents"];','const tabs:Tab[]=manager?["overview","analytics","agents"]:["overview","analytics","pipeline","agents"];','tabs')
          s=replace_once(s,'${manager?"grid-cols-2":"grid-cols-3"}','${manager?"grid-cols-3":"grid-cols-4"}','nav cols')
          old='{x==="overview"?t("Overview","Overview"):x==="pipeline"?t("Pipeline Editor","Pipeline Editor"):t("Agents","Agents")}'
          new='{x==="overview"?t("Overview","Overview"):x==="analytics"?t("Meeting Analytics","Meeting Analytics"):x==="pipeline"?t("Pipeline Editor","Pipeline Editor"):t("Agents","Agents")}'
          s=replace_once(s,old,new,'nav label')
          marker='{error&&<div className="mb-3 rounded-xl border border-red-300 bg-red-50 p-3 text-sm font-bold text-red-800">{error}</div>}\n\n      {tab==="overview"&&<>'
          repl='{error&&<div className="mb-3 rounded-xl border border-red-300 bg-red-50 p-3 text-sm font-bold text-red-800">{error}</div>}\n\n      {tab==="analytics"&&<SalesWarRoomMeetingAnalytics scope={scope} token={token} lang={lang}/>}\n\n      {tab==="overview"&&<>'
          s=replace_once(s,marker,repl,'analytics render')
          p.write_text(s)

          p=Path('src/pages/SalesWarRoom.tsx')
          s=p.read_text()
          s=replace_once(s,'import { salesWarRoomApi } from "../lib/salesWarRoomApi";','import { salesWarRoomApi } from "../lib/salesWarRoomApi";\nimport SalesWarRoomActivityLedger from "../components/SalesWarRoomActivityLedger";','agent import')
          marker='        {pipelineView==="funnel"&&<FunnelView pipeline={pipeline} stages={stages} ar={ar} lang={lang} t={t}/>} \n\n        <div className="mt-5 border-t pt-4">'
          repl='        {pipelineView==="funnel"&&<FunnelView pipeline={pipeline} stages={stages} ar={ar} lang={lang} t={t}/>} \n\n        <SalesWarRoomActivityLedger pipeline={pipeline} token={token} lang={lang}/>\n\n        <div className="mt-5 border-t pt-4">'
          s=replace_once(s,marker,repl,'activity ledger')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Build web app
        run: yarn build
      - name: Commit analytics UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SalesWarRoomControlDashboard.tsx src/pages/SalesWarRoom.tsx
          git commit -m "Add meeting analytics and lead activity log UI"
          git push origin HEAD:war-room-meeting-analytics
