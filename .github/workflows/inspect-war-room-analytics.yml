name: Inspect War Room Analytics Branch

on:
  push:
    branches: [war-room-meeting-analytics]
    paths:
      - '.github/workflows/inspect-war-room-analytics.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect lead render markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/pages/SalesWarRoom.tsx').read_text()
          print('length',len(s))
          for needle in ['pipeline.map','notes','client_name','LeadCard','pipelineView','filtered','stageTab','next_action_date']:
              print('\n===',needle,'count',s.count(needle),'===')
              pos=0
              shown=0
              while shown<8:
                  i=s.find(needle,pos)
                  if i<0: break
                  print(s[max(0,i-500):min(len(s),i+900)].replace('\n','\\n'))
                  pos=i+len(needle);shown+=1
          PY
