name: Website checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Save tested source
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/tested-source.tar.gz"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Netlify function entrypoints
        run: node scripts/test-netlify-functions.cjs
      - name: Install dependencies using the existing Netlify policy
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --non-interactive
      - name: Website tests and production build
        shell: bash
        run: |
          set -o pipefail
          yarn run check 2>&1 | tee "$RUNNER_TEMP/website-check.log"
      - name: Package functions using Netlify's bundler
        env:
          NETLIFY_ZISI_MODULE: ${{ runner.temp }}/netlify-tools/node_modules/@netlify/zip-it-and-ship-it/dist/main.js
          NETLIFY_BUNDLE_OUTPUT: ${{ runner.temp }}/netlify-function-check
        shell: bash
        run: |
          set -o pipefail
          npm install --prefix "$RUNNER_TEMP/netlify-tools" --no-save --no-package-lock @netlify/zip-it-and-ship-it@16.3.0
          node scripts/test-netlify-functions.cjs --bundle 2>&1 | tee "$RUNNER_TEMP/netlify-function-check.log"
      - name: Rendered browser smoke tests
        if: hashFiles('scripts/test-render-browser.cjs') != ''
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-render-browser.cjs 2>&1 | tee "$RUNNER_TEMP/browser-check.log"
      - name: Save check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-check-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/tested-source.tar.gz
            ${{ runner.temp }}/website-check.log
            ${{ runner.temp }}/browser-check.log
            ${{ runner.temp }}/netlify-function-check.log
            ${{ runner.temp }}/netlify-function-check/manifest.json
            ${{ runner.temp }}/netlify-function-check/summary.json
            browser-check-evidence/
          retention-days: 7
