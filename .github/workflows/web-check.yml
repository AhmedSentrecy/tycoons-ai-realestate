name: Website checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Save tested source
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/tested-source.tar.gz"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
      - name: Website tests and production build
        env:
          AGENT_USAGE_LOGGING: 'off'
        shell: bash
        run: |
          set -o pipefail
          yarn run check 2>&1 | tee "$RUNNER_TEMP/website-check.log"
      - name: Save check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-check-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/tested-source.tar.gz
            ${{ runner.temp }}/website-check.log
          retention-days: 7
