name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Build web app
        run: yarn build

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf ios-package
          mkdir -p ios-package/Payload
          cp -R ios-build/Build/Products/Debug-iphoneos/App.app ios-package/Payload/
          cd ios-package
          zip -qry Tycoons-Sales-War-Room-Unsigned.ipa Payload
          shasum -a 256 Tycoons-Sales-War-Room-Unsigned.ipa > Tycoons-Sales-War-Room-Unsigned.sha256

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tycoons-Sales-War-Room-iOS-Unsigned
          path: |
            ios-package/Tycoons-Sales-War-Room-Unsigned.ipa
            ios-package/Tycoons-Sales-War-Room-Unsigned.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Publish stable unsigned iOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view war-room-ios-unsigned >/dev/null 2>&1; then
            gh release upload war-room-ios-unsigned \
              ios-package/Tycoons-Sales-War-Room-Unsigned.ipa \
              ios-package/Tycoons-Sales-War-Room-Unsigned.sha256 \
              --clobber
          else
            gh release create war-room-ios-unsigned \
              ios-package/Tycoons-Sales-War-Room-Unsigned.ipa \
              ios-package/Tycoons-Sales-War-Room-Unsigned.sha256 \
              --target "$GITHUB_SHA" \
              --title "Tycoons Sales War Room - Unsigned iOS" \
              --notes "Unsigned iOS build for personal sideload signing. Sign this IPA with your own Apple account before installing on an iPhone."
          fi
