name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Build web app
        run: yarn build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Android downloads
        run: |
          mkdir -p mobile-build
          cp android/app/build/outputs/apk/debug/app-debug.apk mobile-build/Tycoons-Sales-War-Room.apk
          cd mobile-build
          zip -9 Tycoons-Sales-War-Room.zip Tycoons-Sales-War-Room.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tycoons-Sales-War-Room-Android
          path: |
            mobile-build/Tycoons-Sales-War-Room.apk
            mobile-build/Tycoons-Sales-War-Room.zip
          retention-days: 14
          if-no-files-found: error

      - name: Publish stable direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view war-room-latest >/dev/null 2>&1; then
            gh release upload war-room-latest \
              mobile-build/Tycoons-Sales-War-Room.apk \
              mobile-build/Tycoons-Sales-War-Room.zip \
              --clobber
          else
            gh release create war-room-latest \
              mobile-build/Tycoons-Sales-War-Room.apk \
              mobile-build/Tycoons-Sales-War-Room.zip \
              --target "$GITHUB_SHA" \
              --title "Tycoons Sales War Room - Latest Android" \
              --notes "Latest cloud-built Android test version. This release is updated manually while War Room changes are being finalized."
          fi
