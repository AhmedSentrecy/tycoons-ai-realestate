name: Patch Web Push UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-web-push-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Patch notification center
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/SalesWarRoomNotificationCenter.tsx')
          s = p.read_text()

          def rep(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Expected one match, got {n}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          rep(
          "} from '../lib/warRoomNotifications'\n",
          "} from '../lib/warRoomNotifications'\nimport { enableWebPush, getWebPushState, webPushSupported } from '../lib/warRoomWebPush'\n"
          )

          rep(
          "  const [error, setError] = useState('')\n  const [, setAuthTick] = useState(0)",
          "  const [error, setError] = useState('')\n  const [pushState, setPushState] = useState<'unsupported' | 'denied' | 'enabled' | 'idle' | 'busy'>('idle')\n  const [pushMessage, setPushMessage] = useState('')\n  const [, setAuthTick] = useState(0)"
          )

          rep(
          "  const agentToken = agentSlug ? (localStorage.getItem(`warRoomAgentToken:${agentSlug}`) || '') : ''\n",
          "  const agentToken = agentSlug ? (localStorage.getItem(`warRoomAgentToken:${agentSlug}`) || '') : ''\n  const controlSession = Boolean(ownerToken || managerToken || sessionStorage.getItem('warRoomControlReturnTo'))\n"
          )

          marker = "  function mergeTeamInbox(agents: any[], pipeline: any[]) {"
          push_effect = '''  useEffect(() => {\n    let cancelled = false\n    if (mode !== 'agent' || controlSession || !webPushSupported()) {\n      setPushState('unsupported')\n      setPushMessage('')\n      return\n    }\n    void getWebPushState()\n      .then(state => { if (!cancelled) setPushState(state) })\n      .catch(() => { if (!cancelled) setPushState('idle') })\n    return () => { cancelled = true }\n  }, [mode, agentSlug, agentToken, controlSession])\n\n'''
          rep(marker, push_effect + marker)

          marker = "  const unread = useMemo(() => items.filter(item => !item.readAt).length, [items])\n"
          push_fn = '''  async function enableDesktopNotifications() {\n    if (pushState !== 'idle' || !agentToken) return\n    try {\n      setPushState('busy')\n      setPushMessage('')\n      setError('')\n      await enableWebPush(agentToken)\n      setPushState('enabled')\n      setPushMessage(t('Desktop notifications are enabled on this computer.', 'تنبيهات الديسكتوب اتفعلت على الجهاز ده.'))\n    } catch (e: any) {\n      const code = String(e?.message || e || '')\n      if (code === 'notifications_denied') {\n        setPushState('denied')\n        setError(t('Chrome notifications are blocked. Allow notifications for this site from Chrome settings.', 'تنبيهات Chrome مقفولة. اسمح للموقع بالتنبيهات من إعدادات Chrome.'))\n        return\n      }\n      if (code === 'direct_agent_session_required') {\n        setPushState('unsupported')\n        setError(t('Desktop push can only be enabled from the agent’s direct login, not through Manager or Owner access.', 'تنبيهات الديسكتوب تتفعل من دخول الـAgent المباشر فقط، مش من دخول Manager أو Owner.'))\n        return\n      }\n      const state = await getWebPushState().catch(() => 'idle' as const)\n      setPushState(state)\n      setError(t('Could not enable desktop notifications. Try again.', 'معرفناش نفعل تنبيهات الديسكتوب. جرّب تاني.'))\n    }\n  }\n\n'''
          rep(marker, push_fn + marker)

          rep(
          "            {error && <div className=\"border-b bg-red-50 px-4 py-2 text-xs font-bold text-red-700\">{error}</div>}\n\n            <div className=\"max-h-[min(64vh,580px)] overflow-y-auto p-2\">",
          "            {error && <div className=\"border-b bg-red-50 px-4 py-2 text-xs font-bold text-red-700\">{error}</div>}\n\n            {mode === 'agent' && !controlSession && (\n              <div className=\"border-b bg-slate-50 p-3\">\n                <button\n                  type=\"button\"\n                  disabled={pushState !== 'idle'}\n                  onClick={() => void enableDesktopNotifications()}\n                  className={`w-full rounded-xl px-3 py-2.5 text-xs font-black transition ${pushState === 'enabled' ? 'bg-emerald-600 text-white' : pushState === 'denied' || pushState === 'unsupported' ? 'bg-slate-200 text-slate-500' : 'bg-slate-950 text-white disabled:opacity-70'}`}\n                >\n                  {pushState === 'enabled' ? t('✓ Desktop notifications ON', '✓ تنبيهات الديسكتوب شغالة') : pushState === 'busy' ? t('Enabling…', 'جاري التفعيل…') : pushState === 'denied' ? t('Notifications blocked in Chrome', 'التنبيهات مقفولة في Chrome') : pushState === 'unsupported' ? t('Desktop notifications unavailable', 'تنبيهات الديسكتوب غير متاحة') : t('Enable Desktop Notifications', 'فعّل تنبيهات الديسكتوب')}\n                </button>\n                <div className=\"mt-1.5 text-[10px] font-bold leading-4 text-slate-400\">\n                  {t('Follow-up reminders can appear in Windows even when this War Room tab is not open.', 'تنبيهات الـFollow-up تقدر تظهر في Windows حتى لو تاب الـWar Room مش مفتوحة.')}\n                </div>\n                {pushMessage && <div className=\"mt-1 text-[10px] font-black text-emerald-700\">{pushMessage}</div>}\n              </div>\n            )}\n\n            <div className=\"max-h-[min(64vh,580px)] overflow-y-auto p-2\">"
          )

          p.write_text(s)
          PY

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Build web app
        run: yarn build

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SalesWarRoomNotificationCenter.tsx
          git commit -m "Enable desktop web push notifications"
          git push origin HEAD:main
