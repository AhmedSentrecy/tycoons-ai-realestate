name: Apply approved SEO renderer release

on:
  push:
    branches: [seo-geo-global-gap-fixes-20261014]
    paths:
      - '.github/workflows/apply-seo-render-release.yml'
      - 'release/seo-edits/**'

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.repository == 'AhmedSentrecy/tycoons-ai-realestate' && github.ref == 'refs/heads/seo-geo-global-gap-fixes-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed edits with before and after hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          root = pathlib.Path.cwd()
          parts = [root / f'release/seo-edits/part-{i:02d}.b64' for i in (1,2,3)]
          raw = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '0c4e03fbe59f8e1be6539a35ece22ac0bca73e2e2685e4a696cac121d1c612ee', 'Edit bundle hash mismatch'
          changes = json.loads(raw)
          allowed = set('''docs/seo-render-release-2026-10-14.md
          netlify/functions/_article-render.cjs
          netlify/functions/_article-render.d.cts
          netlify/functions/_project-schema.cjs
          netlify/functions/_project-schema.d.cts
          netlify/functions/_seo-utils.cjs
          package.json
          scripts/generate-data-pages.cjs
          scripts/lib/data-pages.cjs
          scripts/lib/page-shell.cjs
          scripts/test-article-render-contract.cjs
          scripts/test-article-research.cjs
          scripts/test-data-pages.cjs
          scripts/test-render-browser.cjs
          scripts/test-render-contract.cjs
          src/components/GuideBody.tsx
          src/components/PageStructuredData.tsx
          src/lib/editorialGuides.ts
          src/pages/GuidePage.tsx
          src/pages/ProjectPage.tsx
          vite.config.ts'''.splitlines())
          assert {c['path'] for c in changes} == allowed and len(changes) == len(allowed)
          prepared = []
          for c in changes:
              p = root / c['path']
              assert p.resolve().is_relative_to(root)
              old = p.read_bytes() if p.exists() else b''
              if c['before'] is None:
                  assert not p.exists(), f'New path already exists: {p}'
              else:
                  assert hashlib.sha256(old).hexdigest() == c['before'], f'Source changed: {p}'
              text = old.decode('utf8')
              for start, end, replacement in reversed(c['edits']):
                  assert 0 <= start <= end <= len(text)
                  text = text[:start] + replacement + text[end:]
              result = text.encode('utf8')
              assert hashlib.sha256(result).hexdigest() == c['after'], f'Output hash mismatch: {p}'
              prepared.append((p, result))
          for p, result in prepared:
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(result)
              print('Applied:', p.relative_to(root))
          pathlib.Path('/tmp/seo-approved-paths.txt').write_text('\n'.join(sorted(allowed)) + '\n')
          PY
      - name: Commit approved implementation on the existing review branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file; do git add -- "$file"; done < /tmp/seo-approved-paths.txt
          git rm release/seo-edits/part-01.b64 release/seo-edits/part-02.b64 release/seo-edits/part-03.b64
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'fix: unify property schemas, localize guides and render comparison tables'
          git push origin HEAD:refs/heads/seo-geo-global-gap-fixes-20261014
          git rev-parse HEAD | tee "$RUNNER_TEMP/tested-commit.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies using the existing Netlify policy
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --non-interactive
      - name: Complete website tests and build
        env:
          AGENT_USAGE_LOGGING: 'off'
        shell: bash
        run: |
          set -o pipefail
          yarn run check 2>&1 | tee "$RUNNER_TEMP/website-check.log"
      - name: Rendered mobile and application browser checks
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-render-browser.cjs 2>&1 | tee "$RUNNER_TEMP/browser-check.log"
      - name: Archive tested source
        if: always()
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/tested-source.tar.gz"
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-render-release-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tested-source.tar.gz
            ${{ runner.temp }}/tested-commit.txt
            ${{ runner.temp }}/website-check.log
            ${{ runner.temp }}/browser-check.log
            browser-check-evidence/
          retention-days: 7
