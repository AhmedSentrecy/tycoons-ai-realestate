name: Inspect Saturday Periods
on:
  push:
    branches: [war-room-saturday-periods]
    paths: ['.github/workflows/inspect-saturday-periods.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/pages/SalesWarRoom.tsx').read_text()
          print('LEN',len(s),'weekly refs',s.count('weekly.'))
          pos=0
          while True:
              i=s.find('weekly.',pos)
              if i<0: break
              print('\nAT',i)
              print(s[max(0,i-900):min(len(s),i+1200)].replace('\n','\\n'))
              pos=i+7
          PY
